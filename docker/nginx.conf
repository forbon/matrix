server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Security-Header (alle Responses) ───────────────────────
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fonts: CORS nur für devenv.de (Legal-Seiten) + langer Immutable-Cache
    location /fonts/ {
        add_header Access-Control-Allow-Origin "https://devenv.de" always;
        add_header Vary                         "Origin"            always;
        add_header Cache-Control                "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options       "nosniff"           always;
        types { font/woff2 woff2; }
        try_files $uri =404;
    }

    # Runtime-Config: nie cachen (damit Volume-Mount sofort greift)
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }
}
